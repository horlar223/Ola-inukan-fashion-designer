<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Custom Outfits Online | Ola Inukan Fashion Designer</title>

    <meta name="description" content="Order beautifully tailored traditional outfits, native wears and custom fashion designs from Ola Inukan Fashion Designer. We welcome customers worldwide.">

    <meta name="keywords" content="order custom outfits, online fashion orders, Nigerian fashion designer, bespoke clothing">

    <meta name="author" content="Ola Inukan Fashion Designer">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#064E3B">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <div class="logo">
            OLA INUKAN
            <span>FASHION DESIGNER</span>
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="collections.html">Collections</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>

        <a href="order.html" class="order-btn">Order Now</a>

    </nav>

    <!-- Order Section -->
    <section class="order-page">

        <div class="order-heading">
            <span>LET'S CREATE SOMETHING BEAUTIFUL</span>
            <h1>Place Your Order</h1>
            <p>Tell us what you would love us to create for you. We welcome customers from Nigeria and around the world.</p>
        </div>

        <div class="order-form-container">

            <form id="fashionOrderForm">

                <div class="order-group">
                    <label for="customerName">Full Name</label>
                    <input type="text" id="customerName" name="customerName" placeholder="Enter your full name" required>
                </div>

                <div class="order-group">
                    <label for="customerEmail">Email Address</label>
                    <input type="email" id="customerEmail" name="customerEmail" placeholder="Enter your email address" required>
                </div>

                <div class="order-group">
                    <label for="phone">Phone / WhatsApp Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="Include your country code" required>
                </div>

                <div class="order-group">
                    <label for="country">Country of Residence</label>
                    <input type="text" id="country" name="country" placeholder="e.g. Nigeria, United Kingdom, Canada" required>
                </div>

                <div class="order-group">
                    <label for="outfit">Type of Outfit</label>
                    <select id="outfit" name="outfit" required>
                        <option value="">Select an outfit</option>
                        <option value="Traditional Outfit">Traditional Outfit</option>
                        <option value="Native Wear">Native Wear</option>
                        <option value="Corporate Outfit">Corporate Outfit</option>
                        <option value="Custom Design">Custom Design</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="order-group">
                    <label for="occasion">Occasion</label>
                    <input type="text" id="occasion" name="occasion" placeholder="e.g. Wedding, Birthday, Office">
                </div>

                <div class="order-group">
                    <label for="deliveryDate">Preferred Delivery Date</label>
                    <input type="date" id="deliveryDate" name="deliveryDate">
                </div>

                <div class="order-group">
                    <label for="details">Additional Details</label>
                    <textarea id="details" name="details" rows="6" placeholder="Describe the outfit you want, including your preferred style and colour."></textarea>
                </div>

                <button type="submit" class="order-submit">
                    Submit Order Request
                </button>

            </form>

        </div>

    </section>

    <script src="script.js"></script>

    <a href="https://wa.me/2348084676837"
   class="whatsapp-float"
   target="_blank"
   aria-label="Chat with us on WhatsApp">

    <span>💬 Chat with us</span>

</a>

</body>
</html>
